name: release

# Push a tag like v1.0.0 to build the app and publish it as a GitHub Release.
# The zip is attached as `Akkim.zip` so this URL always points at the newest build:
#   https://github.com/karanglass24-lang/akkim/releases/latest/download/Akkim.zip
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Optional Developer ID signing + notarization. Skipped (ad-hoc build)
      # until these repository secrets exist:
      #   MACOS_CERT_P12        base64 .p12 with "Developer ID Application" and
      #                         "Developer ID Installer" identities
      #   MACOS_CERT_PASSWORD   password of the .p12
      #   NOTARY_APPLE_ID, NOTARY_PASSWORD (app-specific), NOTARY_TEAM_ID
      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12}" ]; then
            echo "No signing secrets: ad-hoc build"
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(uuidgen)"
          echo "${MACOS_CERT_P12}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "${MACOS_CERT_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          APP_ID="$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          PKG_ID="$(security find-identity -v "$KC" | sed -n 's/.*"\(Developer ID Installer:[^"]*\)".*/\1/p' | head -1)"
          echo "AKKIM_SIGN_IDENTITY=${APP_ID}" >> "$GITHUB_ENV"
          echo "AKKIM_INSTALLER_IDENTITY=${PKG_ID}" >> "$GITHUB_ENV"
          echo "AKKIM_NOTARIZE=1" >> "$GITHUB_ENV"

      - name: Build app bundle
        run: bash scripts/package-app.sh

      - name: Notarize app
        if: env.AKKIM_NOTARIZE == '1'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent dist/Akkim.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
            --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$NOTARY_TEAM_ID"
          xcrun stapler staple dist/Akkim.app

      - name: Verify signature and contents
        run: |
          set -euo pipefail
          codesign --verify --deep --strict dist/Akkim.app
          test -f dist/Akkim.app/Contents/Resources/LICENSE
          test -f dist/Akkim.app/Contents/Resources/THIRD-PARTY-NOTICES.md
          test -x dist/Akkim.app/Contents/MacOS/Akkim

      - name: Package zip
        run: |
          set -euo pipefail
          cd dist
          ditto -c -k --keepParent Akkim.app Akkim.zip
          shasum -a 256 Akkim.zip > Akkim.zip.sha256
          cat Akkim.zip.sha256

      - name: Package installer
        run: |
          set -euo pipefail
          bash scripts/build-pkg.sh dist/Akkim.pkg

      - name: Notarize installer
        if: env.AKKIM_NOTARIZE == '1' && env.AKKIM_INSTALLER_IDENTITY != ''
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit dist/Akkim.pkg --wait \
            --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$NOTARY_TEAM_ID"
          xcrun stapler staple dist/Akkim.pkg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "dist/Akkim.pkg" "dist/Akkim.zip" "dist/Akkim.zip.sha256" \
            --title "아낌 ${GITHUB_REF_NAME}" \
            --notes "첫 설치는 **Akkim.pkg** (앱+헬퍼 한 번에 설치). 기존 사용자는 앱의 자동 업데이트를 쓰세요." \
            --generate-notes
